name: collection-credentials-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      YANDEX_SEARCH_FOLDER_ID: ${{ secrets.YANDEX_SEARCH_FOLDER_ID }}
      TWO_GIS_API_KEY: ${{ secrets.TWO_GIS_API_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
      SOIKA_PREFLIGHT_OUTPUT: build/collection-credentials-preflight.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install focused runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.24.3 \
            pyproj==3.7.2 \
            shapely==2.0.1 \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142 \
            defusedxml==0.7.1

      - name: Validate external credentials without exposing secrets
        id: preflight
        continue-on-error: true
        run: |
          mkdir -p build
          python scripts/collection_credentials_preflight.py

      - name: Upload redacted preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-credentials-preflight
          path: build/collection-credentials-preflight.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Yandex and 2GIS credential preflight
        if: steps.preflight.outcome != 'success'
        run: |
          echo 'Collection credential preflight failed. Inspect the redacted artifact.'
          exit 1
