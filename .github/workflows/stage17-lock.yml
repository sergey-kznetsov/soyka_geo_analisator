name: stage17-lock

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry==2.4.1
      - name: Resolve dependency profiles
        run: |
          poetry check
          poetry lock
          poetry check --lock
      - name: Upload resolved lock
        uses: actions/upload-artifact@v4
        with:
          name: stage17-poetry-lock
          path: poetry.lock
          if-no-files-found: error
          retention-days: 3
