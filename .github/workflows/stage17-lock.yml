name: stage17-lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry==2.4.1
      - name: Resolve and validate production lock
        run: |
          poetry lock
          poetry check --lock
      - name: Commit changed lock to PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "Regenerate production dependency lock"
          git push origin "HEAD:${HEAD_BRANCH}"
