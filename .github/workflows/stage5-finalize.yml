name: stage5-finalize

on:
  push:
    branches: [agent/parser-platform-compliance]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parser-platform-compliance

      - name: Mark stage 5 complete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/DEVELOPMENT_PLAN.md")
          text = path.read_text(encoding="utf-8")
          old = "**Статус: реализовано, проходит проверку.**"
          new = "**Статус: выполнено 5 августа 2026 года.**"
          if old not in text:
              raise SystemExit("stage 5 pending status not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/stage5-finalize.yml

      - name: Commit finalized development plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mark parser platform stage complete"
          git push origin HEAD:agent/parser-platform-compliance
