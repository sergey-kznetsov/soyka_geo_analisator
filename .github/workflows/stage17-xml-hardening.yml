name: stage17-xml-hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-hardening:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Replace untrusted XML parser with defusedxml
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("soika_uds/parsers/connectors/adapters.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from xml.etree import ElementTree\n"
          new_import = (
              "from defusedxml.ElementTree import fromstring as safe_xml_fromstring\n"
              "from xml.etree import ElementTree\n"
          )
          old_call = "root = ElementTree.fromstring(body)"
          new_call = "root = safe_xml_fromstring(body)"
          if text.count(old_import) != 1:
              raise SystemExit("expected exactly one ElementTree import")
          if text.count(old_call) != 1:
              raise SystemExit("expected exactly one untrusted XML parse call")
          text = text.replace(old_import, new_import).replace(old_call, new_call)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit hardening and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage17-xml-hardening.yml
          git add soika_uds/parsers/connectors/adapters.py
          git commit -m "Harden external XML parsing"
          git push origin "HEAD:${HEAD_BRANCH}"
