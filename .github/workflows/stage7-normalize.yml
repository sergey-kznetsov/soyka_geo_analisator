name: stage7-normalize

on:
  push:
    branches: [agent/stage7-preprocessing-deduplication]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage7-preprocessing-deduplication

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Normalize stage 7 sources
        run: |
          python -m pip install ruff==0.6.9
          ruff format soika_uds/__init__.py soika_uds/preprocessing tests/unit/test_preprocessing.py
          ruff check --fix --unsafe-fixes soika_uds/__init__.py soika_uds/preprocessing tests/unit/test_preprocessing.py
          ruff check soika_uds/__init__.py soika_uds/preprocessing tests/unit/test_preprocessing.py

      - name: Remove temporary workflow
        run: rm .github/workflows/stage7-normalize.yml

      - name: Commit normalized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize stage 7 preprocessing"
          git push origin HEAD:agent/stage7-preprocessing-deduplication
