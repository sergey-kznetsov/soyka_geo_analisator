name: telegram-slice-diagnostics

on:
  pull_request:
    paths:
      - 'soika_uds/discovery/telegram.py'
      - 'tests/unit/test_telegram_collection.py'
      - 'requirements-telegram.txt'
      - 'Dockerfile'
      - '.github/workflows/telegram-slice-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.6.9 pytest==8.3.5 numpy==1.24.3 pyproj==3.7.2 shapely==2.0.1 pymorphy3==2.0.6 pymorphy3-dicts-ru==2.4.417150.4580142 defusedxml==0.7.1
      - name: Run diagnostics and persist output
        shell: bash
        run: |
          mkdir -p build
          set +e
          ruff check soika_uds/discovery/telegram.py tests/unit/test_telegram_collection.py > build/ruff.txt 2>&1
          echo $? > build/ruff.exit
          pytest -q tests/unit/test_telegram_collection.py > build/pytest.txt 2>&1
          echo $? > build/pytest.exit
          python -m pip install --require-hashes --no-deps -r requirements-telegram.txt > build/telegram-deps.txt 2>&1
          echo $? > build/telegram-deps.exit
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-slice-diagnostics
          path: build/
          retention-days: 2
