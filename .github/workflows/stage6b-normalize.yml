name: stage6b-normalize

on:
  push:
    branches: [agent/stage6b-parser-adapters]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage6b-parser-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Normalize stage 6B sources
        run: |
          python -m pip install --upgrade ruff==0.6.9
          ruff format \
            soika_uds/parsers/connectors \
            tests/unit/connector_fixture_support.py \
            tests/unit/test_connector_adapters.py
          ruff check --fix --unsafe-fixes \
            soika_uds/parsers/connectors \
            tests/unit/connector_fixture_support.py \
            tests/unit/test_connector_adapters.py || true

      - name: Remove temporary workflow
        run: rm .github/workflows/stage6b-normalize.yml

      - name: Commit normalized stage 6B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize stage 6B adapters"
          git push origin HEAD:agent/stage6b-parser-adapters
