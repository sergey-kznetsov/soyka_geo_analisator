name: stage6b-results

on:
  push:
    branches: [agent/stage6b-parser-adapters]

permissions:
  contents: write

jobs:
  collect-results:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage6b-parser-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install minimal runtime dependencies
        run: |
          python -m pip install --upgrade \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142

      - name: Generate fixture ParserRunner result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from soika_uds.parsers import InMemoryParserCheckpointStore, ParserRunner
          from soika_uds.parsers.connectors import (
              OkApiCredentials,
              OkMd5Signer,
              build_prepared_parser_registry,
          )
          from tests.unit.connector_fixture_support import (
              FixtureTransport,
              NOW,
              compliance_context,
              connector_policies,
              connector_requests,
          )

          policies = connector_policies()
          transport = FixtureTransport()
          registry = build_prepared_parser_registry(
              policies,
              ok_signer=OkMd5Signer(
                  OkApiCredentials("fixture-app", "fixture-secret", "fixture-token")
              ),
          )
          runner = ParserRunner(
              registry,
              InMemoryParserCheckpointStore(),
              clock=lambda: NOW,
              monotonic=lambda: 0.0,
              sleep=lambda seconds: None,
              transport_factory=lambda policy: transport,
          )
          sources = {}
          for source_id, request in connector_requests().items():
              result = runner.run(request, compliance_context(policies[source_id]))
              sources[source_id] = {
                  "coverage": result.coverage.to_dict(),
                  "final_checkpoint": (
                      dict(result.final_checkpoint)
                      if result.final_checkpoint is not None
                      else None
                  ),
                  "messages": [
                      {
                          "source": message.source,
                          "external_id": message.external_id,
                          "text": message.text,
                          "published_at": message.published_at.isoformat(),
                          "url": message.url,
                          "metadata": dict(message.metadata),
                      }
                      for message in result.messages
                  ],
              }
          expected = {
              "vk",
              "ok",
              "local-media",
              "municipal-public",
              "dzen",
              "pikabu",
              "rutube",
          }
          if set(sources) != expected:
              raise SystemExit("fixture result does not cover every connector")
          if any(not item["messages"] for item in sources.values()):
              raise SystemExit("fixture result contains an empty source")
          report = {
              "schema_version": "1.0.0",
              "result_kind": "fixture_parser_runner_integration",
              "generated_at": NOW.isoformat(),
              "all_sources_returned_messages": True,
              "transport_urls": transport.urls,
              "sources": sources,
          }
          path = Path("docs/STAGE_6B_FIXTURE_RESULTS.json")
          path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run controlled external probes
        run: |
          set +e
          python soika_uds/parsers/connectors/external.py \
            --targets configs/connectors/external-probe-targets.json \
            --output docs/STAGE_6B_EXTERNAL_RESULTS.json
          probe_status=$?
          set -e
          echo "controlled external probe exit status: ${probe_status}"
          test -s docs/STAGE_6B_EXTERNAL_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("docs/STAGE_6B_EXTERNAL_RESULTS.json").read_text(encoding="utf-8")
          )
          results = report.get("results", [])
          expected = {
              "vk",
              "ok",
              "local-media",
              "municipal-public",
              "dzen",
              "pikabu",
              "rutube",
          }
          if len(results) != 7 or {item.get("source_id") for item in results} != expected:
              raise SystemExit("external report does not cover every connector")
          for item in results:
              if item.get("status_code") is None and not item.get("error"):
                  raise SystemExit("external report contains an unclassified result")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/stage6b-results.yml

      - name: Commit stage 6B result reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record stage 6B parser results"
          git push origin HEAD:agent/stage6b-parser-adapters
