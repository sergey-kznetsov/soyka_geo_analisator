name: stage6b-source-id-fix

on:
  push:
    branches: [agent/stage6b-parser-adapters]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage6b-parser-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Align parser source ID contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("soika_uds/parsers/models.py")
          text = path.read_text(encoding="utf-8")
          old = '_SOURCE_ID_RE = re.compile(r"^[a-z][a-z0-9._-]{2,63}$")'
          new = '_SOURCE_ID_RE = re.compile(r"^[a-z][a-z0-9._-]{1,63}$")'
          if text.count(old) != 1:
              raise SystemExit("expected source ID regex not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install --upgrade \
            pytest==7.4.4 \
            ruff==0.6.9 \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142
          ruff check soika_uds/parsers/models.py tests/unit/test_connector_adapters.py
          python -m pytest -q tests/unit

      - name: Remove temporary workflow
        run: rm .github/workflows/stage6b-source-id-fix.yml

      - name: Commit contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align parser source ID contract"
          git push origin HEAD:agent/stage6b-parser-adapters
