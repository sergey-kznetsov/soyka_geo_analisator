name: stage4-format

on:
  push:
    branches: [agent/durable-job-orchestrator]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-job-orchestrator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Normalize imports
        run: |
          python -m pip install ruff==0.6.9
          ruff check --fix \
            soika_uds/__init__.py \
            soika_uds/orchestration/__init__.py \
            soika_uds/orchestration/orchestrator.py \
            tests/unit/test_orchestrator.py
          rm .github/workflows/stage4-format.yml

      - name: Commit normalized imports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize stage 4 imports"
          git push origin HEAD:agent/durable-job-orchestrator
