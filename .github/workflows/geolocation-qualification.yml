name: geolocation-qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/geolocation-qualification.yml"
      - "models/geolocation_*.json"
      - "poetry.lock"
      - "pyproject.toml"
      - "pymorphy2/**"
      - "soika_uds/geolocation/**"
      - "tests/unit/test_geolocation_qualification_stage9.py"

concurrency:
  group: geolocation-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Restore policy-compliant response cache
        uses: actions/cache@v4
        with:
          path: build/geolocation-cache.sqlite3*
          key: >-
            geolocation-qualification-v1-${{
            hashFiles('models/geolocation_validation_v1.json') }}

      - name: Install locked qualification runtime
        run: |
          python -m pip install --upgrade pip poetry==2.4.1
          poetry install --only main --no-root --no-interaction
          mkdir -p build/wheels
          poetry run python -m pip download --no-deps natasha==1.6.0 --dest build/wheels
          echo "e12b130d05a0b4d2eb6442092ed5b5769a68a311c17f2095b1aa739fb8d6dc78  build/wheels/natasha-1.6.0-py3-none-any.whl" | sha256sum --check
          poetry run python - <<'PY'
          import importlib.metadata
          expected = {
              "natasha": "1.6.0",
              "navec": "0.10.0",
              "razdel": "0.5.0",
              "slovnet": "0.6.0",
              "yargy": "0.16.0",
              "pymorphy3": "2.0.6",
              "requests": "2.31.0",
          }
          actual = {name: importlib.metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"locked qualification versions differ: {actual}")
          print(actual)
          PY

      - name: Run target-city qualification
        id: qualification
        shell: bash
        run: |
          set +e
          poetry run python -m soika_uds.geolocation.qualification_cli \
            --audit models/geolocation_model_audit_v1.json \
            --validation models/geolocation_validation_v1.json \
            --output build/geolocation-qualification-report.json \
            --registry-output build/geolocation-production-registry.json \
            --predictions-output build/geolocation-predictions.json \
            --cache build/geolocation-cache.sqlite3 \
            --user-agent "SOIKA-UDS-Geolocation-Qualification/0.14 (+https://github.com/sergey-kznetsov/soyka_geo_analisator)" \
            --allow-network
          status=$?
          set -e
          if test -f build/geolocation-qualification-report.json; then
            cat build/geolocation-qualification-report.json
          fi
          if test -f build/geolocation-production-registry.json; then
            cat build/geolocation-production-registry.json
          fi
          exit "$status"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geolocation-qualification-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/geolocation-qualification-report.json
            build/geolocation-production-registry.json
            build/geolocation-predictions.json
