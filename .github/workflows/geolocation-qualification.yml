name: geolocation-qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/geolocation-qualification.yml"
      - "evidence/geolocation/**"
      - "models/geolocation_*.json"
      - "poetry.lock"
      - "pymorphy2/**"
      - "scripts/verify_geolocation_evidence.py"
      - "soika_uds/geolocation/**"
      - "tests/unit/test_geolocation_production_registry_stage9.py"
      - "tests/unit/test_geolocation_qualification_stage9.py"
      - "tests/unit/test_qualification_evidence_stage10.py"

concurrency:
  group: geolocation-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Determine qualification mode
        id: mode
        shell: bash
        run: |
          if test "${{ github.event_name }}" = "workflow_dispatch"; then
            live=true
          else
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > changed-files.txt
            cat changed-files.txt
            if grep --extended-regexp --quiet \
              '^(evidence/geolocation/|models/geolocation_.*\.json$|poetry\.lock$|pymorphy2/|soika_uds/geolocation/|tests/unit/test_geolocation_(production_registry|qualification)_stage9\.py$)' \
              changed-files.txt; then
              live=true
            else
              live=false
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "live qualification: $live"

      - name: Verify committed qualification evidence
        run: python scripts/verify_geolocation_evidence.py

      - name: Restore policy-compliant response cache
        if: steps.mode.outputs.live == 'true'
        uses: actions/cache@v4
        with:
          path: build/geolocation-cache.sqlite3*
          key: >-
            geolocation-qualification-v1-${{
            hashFiles('models/geolocation_validation_v1.json') }}

      - name: Install locked qualification runtime
        if: steps.mode.outputs.live == 'true'
        run: |
          python -m pip install --upgrade pip poetry==2.4.1
          poetry install --only main --no-root --no-interaction
          mkdir -p build/wheels
          poetry run python -m pip download --no-deps natasha==1.6.0 --dest build/wheels
          poetry run python -m pip download \
            --no-deps \
            --only-binary=:all: \
            dawg2-python==0.9.0 \
            --dest build/wheels
          echo "e12b130d05a0b4d2eb6442092ed5b5769a68a311c17f2095b1aa739fb8d6dc78  build/wheels/natasha-1.6.0-py3-none-any.whl" | sha256sum --check
          echo "4fab6fc097bd176cd783cd8421b757348ea5a460789e53b0f6bb64831380bab5  build/wheels/dawg2_python-0.9.0-py3-none-any.whl" | sha256sum --check

          # pymorphy2 0.9.1 and pymorphy3 pull two distributions that both own
          # the dawg_python package. Remove the mixed namespace and restore the
          # maintained implementation used by pymorphy3. The repository-local
          # pymorphy2 bridge delegates legacy imports to pymorphy3.
          poetry run python -m pip uninstall -y dawg-python dawg2-python
          poetry run python -m pip install \
            --no-deps \
            build/wheels/dawg2_python-0.9.0-py3-none-any.whl

          poetry run python - <<'PY'
          import importlib.metadata

          expected = {
              "natasha": "1.6.0",
              "navec": "0.10.0",
              "razdel": "0.5.0",
              "slovnet": "0.6.0",
              "yargy": "0.16.0",
              "pymorphy3": "2.0.6",
              "dawg2-python": "0.9.0",
              "requests": "2.31.0",
          }
          actual = {name: importlib.metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"locked qualification versions differ: {actual}")
          try:
              importlib.metadata.version("dawg-python")
          except importlib.metadata.PackageNotFoundError:
              pass
          else:
              raise SystemExit("legacy dawg-python must not remain in qualification runtime")

          from pymorphy3 import MorphAnalyzer
          import natasha

          MorphAnalyzer()
          print(actual)
          print(f"natasha={natasha.__version__ if hasattr(natasha, '__version__') else '1.6.0'}")
          PY

      - name: Run target-city qualification
        if: steps.mode.outputs.live == 'true'
        id: qualification
        shell: bash
        run: |
          set +e
          poetry run python -m soika_uds.geolocation.qualification_cli \
            --audit models/geolocation_model_audit_v1.json \
            --validation models/geolocation_validation_v1.json \
            --output build/geolocation-qualification-report.json \
            --registry-output build/geolocation-production-registry.json \
            --predictions-output build/geolocation-predictions.json \
            --cache build/geolocation-cache.sqlite3 \
            --user-agent "SOIKA-UDS-Geolocation-Qualification/0.15 (+https://github.com/sergey-kznetsov/soyka_geo_analisator)" \
            --allow-network
          status=$?
          set -e
          if test -f build/geolocation-qualification-report.json; then
            cat build/geolocation-qualification-report.json
          fi
          if test -f build/geolocation-production-registry.json; then
            cat build/geolocation-production-registry.json
          fi
          exit "$status"

      - name: Upload qualification evidence
        if: always() && steps.mode.outputs.live == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geolocation-qualification-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/geolocation-qualification-report.json
            build/geolocation-production-registry.json
            build/geolocation-predictions.json