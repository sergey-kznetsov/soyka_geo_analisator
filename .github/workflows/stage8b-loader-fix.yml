name: stage8b-loader-fix

on:
  push:
    branches:
      - agent/stage8b-model-qualification

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage8b-model-qualification
      - name: Enforce fail-closed array parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("soika_uds/classification/qualification.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if not isinstance(raw_policy, Mapping):
              raise ValueError("qualification policy must be an object")
          raw_validation = payload.get("validation")
          raw_quality = payload.get("quality")
          '''
          new = '''    if not isinstance(raw_policy, Mapping):
              raise ValueError("qualification policy must be an object")
          if any(not isinstance(item, Mapping) for item in raw_models):
              raise ValueError("qualification models entries must be objects")
          if any(not isinstance(item, Mapping) for item in raw_benchmarks):
              raise ValueError("qualification benchmarks entries must be objects")
          raw_validation = payload.get("validation")
          raw_quality = payload.get("quality")
          '''
          if text.count(old) != 1:
              raise SystemExit("unexpected loader validation block")
          text = text.replace(old, new)
          text = text.replace(
              '''        models=tuple(
                      _model_from_dict(item)
                      for item in raw_models
                      if isinstance(item, Mapping)
                  ),
          ''',
              '''        models=tuple(_model_from_dict(item) for item in raw_models),
          ''',
          )
          text = text.replace(
              '''        benchmarks=tuple(
                      _benchmark_from_dict(item)
                      for item in raw_benchmarks
                      if isinstance(item, Mapping)
                  ),
          ''',
              '''        benchmarks=tuple(
                      _benchmark_from_dict(item) for item in raw_benchmarks
                  ),
          ''',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/stage8b-loader-fix.yml
      - name: Commit loader fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soika_uds/classification/qualification.py .github/workflows/stage8b-loader-fix.yml
          git commit -m "Reject malformed qualification array entries"
          git push origin HEAD:agent/stage8b-model-qualification
