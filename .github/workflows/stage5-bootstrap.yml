name: stage5-bootstrap

on:
  push:
    branches: [agent/parser-platform-compliance]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parser-platform-compliance

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Verify and materialize parser platform
        run: |
          cat > /tmp/stage5.sha256 <<'EOF'
          49801b16cf808abd8f6c12603dd36d4e13cf8737c8a41d6a56d099e844b4b390  .stage5/payload-000.b64
          ca6ba63271a4ddab13312762630f3e0c64aa1d49b2f64c312c837df33007c963  .stage5/payload-001.b64
          d671d55d79e32fbfdb567747baf7a44eba5321cb2c439347f5796ee1a621bfa2  .stage5/payload-002.b64
          2acc7673e71086b80a7ceeade5e944fbb7854b6d6eca20d6c4d40d01da205de5  .stage5/payload-003.b64
          bfe0041bd5377d692def9f0f9e20b75f9ff1fdcd578a240b4f5f80af558a16e8  .stage5/payload-004.b64
          7aee0639c22d88020c7de58a5543a0f8f6452f6d39d04dd708887001623b6be7  .stage5/payload-005.b64
          7de27d0e9efa06734bf2d9d62184d9bb0cdee6316df0421979db60181639e3bb  .stage5/payload-006.b64
          5a74199dd91e5a05828e817a9caf2bef5a945b99a2996eb25b115a00886c9bd9  .stage5/payload-007.b64
          EOF
          sha256sum --check /tmp/stage5.sha256
          cat .stage5/payload-*.b64 | base64 --decode > /tmp/stage5.tar.gz
          gzip --test /tmp/stage5.tar.gz
          tar -xzf /tmp/stage5.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/DEVELOPMENT_PLAN.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 5. Платформа парсеров\n"
          status = (
              "\n**Статус: реализовано, проходит проверку.**\n\n"
              "Архитектура, правовые gates и security controls: "
              "`docs/PARSER_PLATFORM.md`.\n"
          )
          if status.strip() not in text:
              if marker not in text:
                  raise SystemExit("stage 5 heading not found")
              text = text.replace(marker, marker + status, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate materialized code
        run: |
          python -m pip install --upgrade \
            pytest==7.4.4 \
            ruff==0.6.9 \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142
          ruff check --fix \
            soika_uds/__init__.py \
            soika_uds/parsers \
            tests/unit/test_parser_platform.py
          python -m compileall -q soika_uds/parsers
          python -m pytest -q tests/unit/test_parser_platform.py

      - name: Remove bootstrap artifacts
        run: |
          rm -rf .stage5
          rm .github/workflows/stage5-bootstrap.yml

      - name: Commit parser platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build compliant parser platform"
          git push origin HEAD:agent/parser-platform-compliance
