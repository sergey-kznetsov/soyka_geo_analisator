name: stage4-complete-plan

on:
  push:
    branches: [agent/durable-job-orchestrator]

permissions:
  contents: write

jobs:
  complete-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-job-orchestrator

      - name: Mark development plan stage complete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/DEVELOPMENT_PLAN.md")
          text = path.read_text(encoding="utf-8")
          old = "**Статус: реализовано, проходит проверку.**"
          new = "**Статус: выполнено 5 августа 2026 года.**"
          if text.count(old) != 1:
              raise SystemExit("expected stage 4 status marker not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/stage4-complete-plan.yml

      - name: Commit completed development plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mark orchestrator stage complete in plan"
          git push origin HEAD:agent/durable-job-orchestrator
