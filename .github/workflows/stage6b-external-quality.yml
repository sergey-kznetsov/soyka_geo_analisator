name: stage6b-external-quality

on:
  push:
    branches: [agent/stage6b-parser-adapters]

permissions:
  contents: write

jobs:
  improve-external-result:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage6b-parser-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Add charset-aware extraction and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("soika_uds/parsers/connectors/external.py")
          text = path.read_text(encoding="utf-8")
          marker = "def _extract_json(body: bytes) -> dict[str, Any]:\n"
          decoder = '''def _decode_body(body: bytes, content_type: str | None) -> str:
              charset = "utf-8"
              for parameter in (content_type or "").split(";")[1:]:
                  name, separator, value = parameter.strip().partition("=")
                  if separator and name.lower() == "charset" and value.strip():
                      charset = value.strip().strip("'\\\"")
                      break
              try:
                  return body.decode(charset, errors="replace")
              except LookupError:
                  return body.decode("utf-8", errors="replace")


          '''
          if "def _decode_body(" not in text:
              if marker not in text:
                  raise SystemExit("external decoder insertion point not found")
              text = text.replace(marker, decoder + marker, 1)
          replacements = {
              "def _extract_json(body: bytes) -> dict[str, Any]:": (
                  "def _extract_json(\n"
                  "    body: bytes, content_type: str | None\n"
                  ") -> dict[str, Any]:"
              ),
              'value = json.loads(body.decode("utf-8"))': (
                  "value = json.loads(_decode_body(body, content_type))"
              ),
              "def _extract_html(body: bytes) -> dict[str, Any]:": (
                  "def _extract_html(\n"
                  "    body: bytes, content_type: str | None\n"
                  ") -> dict[str, Any]:"
              ),
              'text = body.decode("utf-8", errors="replace")': (
                  "text = _decode_body(body, content_type)"
              ),
              "return _extract_json(body)": (
                  "return _extract_json(body, content_type)"
              ),
              "return _extract_html(body)": (
                  "return _extract_html(body, content_type)"
              ),
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"expected external fragment not found: {old}")
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/test_connector_adapters.py")
          test_text = test_path.read_text(encoding="utf-8")
          regression = '''\n\ndef test_external_probe_respects_declared_charset() -> None:
              from soika_uds.parsers.connectors.external import _extract

              body = (
                  "<html><head><title>Городские новости</title></head>"
                  "<body>Казань</body></html>"
              ).encode("windows-1251")
              result = _extract(body, "text/html; charset=windows-1251")
              assert result["title"] == "Городские новости"
              assert "Казань" in result["text_sample"]
          '''
          if "test_external_probe_respects_declared_charset" not in test_text:
              test_path.write_text(test_text + regression, encoding="utf-8")
          PY

      - name: Verify code and focused tests
        run: |
          python -m pip install --upgrade \
            pytest==7.4.4 \
            ruff==0.6.9 \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142
          ruff format \
            soika_uds/parsers/connectors/external.py \
            tests/unit/test_connector_adapters.py
          ruff check \
            soika_uds/parsers/connectors/external.py \
            tests/unit/test_connector_adapters.py
          python -m pytest -q tests/unit/test_connector_adapters.py

      - name: Repeat controlled external probes
        run: |
          set +e
          python soika_uds/parsers/connectors/external.py \
            --targets configs/connectors/external-probe-targets.json \
            --output docs/STAGE_6B_EXTERNAL_RESULTS.json
          probe_status=$?
          set -e
          echo "controlled external probe exit status: ${probe_status}"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("docs/STAGE_6B_EXTERNAL_RESULTS.json").read_text(encoding="utf-8")
          )
          results = {item["source_id"]: item for item in report["results"]}
          if set(results) != {
              "vk",
              "ok",
              "local-media",
              "municipal-public",
              "dzen",
              "pikabu",
              "rutube",
          }:
              raise SystemExit("external report source coverage mismatch")
          pikabu = results["pikabu"]["extracted"]
          if "�" in str(pikabu) or not pikabu.get("title"):
              raise SystemExit("Pikabu charset extraction is not readable")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/stage6b-external-quality.yml

      - name: Commit improved external result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve stage 6B external parsing result"
          git push origin HEAD:agent/stage6b-parser-adapters
