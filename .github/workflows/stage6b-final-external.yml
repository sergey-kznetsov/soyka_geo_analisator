name: stage6b-final-external

on:
  push:
    branches: [agent/stage6b-parser-adapters]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage6b-parser-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Run final controlled external probes
        run: |
          set +e
          python soika_uds/parsers/connectors/external.py \
            --targets configs/connectors/external-probe-targets.json \
            --output docs/STAGE_6B_EXTERNAL_RESULTS.json
          probe_status=$?
          set -e
          echo "controlled external probe exit status: ${probe_status}"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("docs/STAGE_6B_EXTERNAL_RESULTS.json").read_text(encoding="utf-8")
          )
          results = {item["source_id"]: item for item in report["results"]}
          if len(results) != 7:
              raise SystemExit("external report does not cover all sources")
          for source_id, item in results.items():
              if item.get("status_code") is None and not item.get("error"):
                  raise SystemExit(f"unclassified result for {source_id}")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/stage6b-final-external.yml

      - name: Commit final external report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh final stage 6B external report"
          git push origin HEAD:agent/stage6b-parser-adapters
