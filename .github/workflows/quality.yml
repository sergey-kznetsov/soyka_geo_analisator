name: quality

on:
  push:
    branches: [main, agent/python311-server-environment]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install quality tools and focused runtime dependencies
        run: >-
          python -m pip install --upgrade
          pip
          pytest==7.4.4
          ruff==0.6.9
          numpy==1.24.3
          pyproj==3.7.2
          shapely==2.0.1
          pymorphy3==2.0.6
          pymorphy3-dicts-ru==2.4.417150.4580142

      - name: Compile Python sources
        run: python -m compileall -q factfinder pymorphy2 soika_uds geoanalyzer_storage

      - name: Lint normalized code
        run: >-
          ruff check
          soika_uds
          geoanalyzer_storage
          pymorphy2
          factfinder/__init__.py
          factfinder/src/__init__.py
          factfinder/src/_classifier_base.py
          factfinder/src/text_classifier.py
          factfinder/src/text_classifier_topics.py
          tests/unit
          tests/integration/test_storage_postgres_stage13.py
          tests/integration/test_worker_queue_stage14.py

      - name: Run deterministic unit tests
        run: python -m pytest -q tests/unit

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry==2.4.1

      - name: Validate committed dependency lock
        run: |
          test -f poetry.lock
          poetry check --lock
          poetry lock
          git diff --exit-code -- poetry.lock

  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:b410052c6f0d7d37b83cac1369df144e1c843971155dea3317961001704d0a9d
        env:
          POSTGRES_DB: geoanalyzer
          POSTGRES_USER: geoanalyzer
          POSTGRES_PASSWORD: stage14-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoanalyzer -d geoanalyzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GEOANALYZER_DATABASE_DSN: postgresql://geoanalyzer:stage14-ci-only@127.0.0.1:5432/geoanalyzer
      GEOANALYZER_TEST_DATABASE_DSN: postgresql://geoanalyzer:stage14-ci-only@127.0.0.1:5432/geoanalyzer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install libpq and focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5
          python -m pip install --upgrade \
            pip \
            pytest==7.4.4 \
            numpy==1.24.3 \
            pyproj==3.7.2 \
            shapely==2.0.1 \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142
          python -m pip install --require-hashes --no-deps -r requirements-storage.txt

      - name: Apply and inspect storage migrations
        run: |
          python -m geoanalyzer_storage.cli migrate --scope platform --scope soika --scope worker
          python -m geoanalyzer_storage.cli check

      - name: Run live PostgreSQL PostGIS integration tests
        run: >-
          python -m pytest -q
          tests/integration/test_storage_postgres_stage13.py
          tests/integration/test_worker_queue_stage14.py

  docker-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Validate worker and module API Compose isolation contract
        run: |
          printf '%s\n' 'postgresql://example.invalid/geoanalyzer' > /tmp/stage15-dsn
          printf '%s\n' 'stage15-ci-module-token' > /tmp/stage15-module-token
          SOIKA_WORKER_EXECUTOR=example.module:factory \
          GEOANALYZER_DATABASE_DSN_FILE=/tmp/stage15-dsn \
          SOIKA_MODULE_AUTH_TOKEN_FILE=/tmp/stage15-module-token \
            docker compose -f docker-compose.workers.yml config >/tmp/stage15-runtime.yml
          ! grep -qE '^[[:space:]]+ports:' /tmp/stage15-runtime.yml
          grep -q 'mem_limit:' /tmp/stage15-runtime.yml
          grep -q 'geoanalyzer_backend' /tmp/stage15-runtime.yml
          grep -q '127.0.0.1:9090/healthz' /tmp/stage15-runtime.yml
          grep -q '127.0.0.1:9080/v1/health' /tmp/stage15-runtime.yml
          grep -q 'soika_module_auth_token' /tmp/stage15-runtime.yml
          ! grep -q '127.0.0.1:8080/healthz' /tmp/stage15-runtime.yml

      - name: Build CPU image
        run: docker build --target cpu --tag soika-uds:cpu .

      - name: Validate storage, worker and module transport in CPU image
        run: >-
          docker run --rm --entrypoint python soika-uds:cpu -c
          "import geoanalyzer_storage, psycopg, psycopg_pool, soika_uds, soika_uds.transport, soika_uds.worker;
          assert geoanalyzer_storage.__version__ == '1.1.0';
          assert psycopg.__version__ == '3.3.4';
          assert soika_uds.__version__ == '0.20.0';
          assert soika_uds.worker.ComputeClass.CPU.value == 'cpu';
          assert soika_uds.transport.MODULE_PROTOCOL_VERSION == '1.0.0'"

      - name: Start CPU environment
        run: docker run --detach --name soika-cpu --publish 18080:8080 soika-uds:cpu

      - name: Validate health and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs soika-cpu
          exit 1

      - name: Build GPU image
        run: docker build --target gpu --tag soika-uds:gpu .

      - name: Stop test container
        if: always()
        run: docker rm --force soika-cpu || true
