name: quality

on:
  push:
    branches: [main, agent/python311-server-environment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install quality tools and morphology bridge dependency
        run: >-
          python -m pip install --upgrade
          pip
          pytest==7.4.4
          ruff==0.6.9
          pymorphy3==2.0.6
          pymorphy3-dicts-ru==2.4.417150.4580142

      - name: Compile Python sources
        run: python -m compileall -q factfinder pymorphy2 soika_uds

      - name: Lint normalized code
        run: >-
          ruff check
          soika_uds
          pymorphy2
          factfinder/__init__.py
          factfinder/src/__init__.py
          factfinder/src/_classifier_base.py
          factfinder/src/text_classifier.py
          factfinder/src/text_classifier_topics.py
          tests/unit

      - name: Run deterministic unit tests
        run: python -m pytest -q tests/unit

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry==2.4.1

      - name: Resolve dependency lock
        run: poetry lock

      - name: Validate project metadata
        run: poetry check

      - name: Upload resolved lock
        uses: actions/upload-artifact@v4
        with:
          name: poetry-lock
          path: poetry.lock
          if-no-files-found: error
          retention-days: 1

      - name: Verify committed lock is current
        run: git diff --exit-code -- poetry.lock

  docker-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Detect committed lock
        id: lock
        run: |
          if test -f poetry.lock; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CPU image
        if: steps.lock.outputs.present == 'true'
        run: docker build --target cpu --tag soika-uds:cpu .

      - name: Start CPU environment
        if: steps.lock.outputs.present == 'true'
        run: docker run --detach --name soika-cpu --publish 18080:8080 soika-uds:cpu

      - name: Validate health and readiness
        if: steps.lock.outputs.present == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs soika-cpu
          exit 1

      - name: Build GPU image
        if: steps.lock.outputs.present == 'true'
        run: docker build --target gpu --tag soika-uds:gpu .

      - name: Stop test container
        if: always() && steps.lock.outputs.present == 'true'
        run: docker rm --force soika-cpu || true
