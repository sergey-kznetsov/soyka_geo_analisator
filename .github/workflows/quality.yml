name: quality

on:
  push:
    branches:
      - main
      - agent/python311-server-environment
      - agent/versioned-soika-contract-v1
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-contract:
    if: >-
      github.ref == 'refs/heads/agent/versioned-soika-contract-v1' ||
      github.head_ref == 'agent/versioned-soika-contract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versioned-soika-contract-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install Ruff
        run: python -m pip install ruff==0.6.9

      - name: Format contract files
        run: |
          ruff format soika_uds/integration tests/unit/test_contract_schemas.py tests/unit/test_integration_contract.py
          ruff check --fix --unsafe-fixes soika_uds/integration tests/unit/test_contract_schemas.py tests/unit/test_integration_contract.py

      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add soika_uds/integration tests/unit/test_contract_schemas.py tests/unit/test_integration_contract.py
            git commit -m "Format integration contract"
            git push origin HEAD:agent/versioned-soika-contract-v1
          fi

  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install quality tools and morphology bridge dependency
        run: >-
          python -m pip install --upgrade
          pip
          pytest==7.4.4
          ruff==0.6.9
          pymorphy3==2.0.6
          pymorphy3-dicts-ru==2.4.417150.4580142

      - name: Compile Python sources
        run: python -m compileall -q factfinder pymorphy2 soika_uds

      - name: Lint normalized code
        run: >-
          ruff check
          soika_uds
          pymorphy2
          factfinder/__init__.py
          factfinder/src/__init__.py
          factfinder/src/_classifier_base.py
          factfinder/src/text_classifier.py
          factfinder/src/text_classifier_topics.py
          tests/unit

      - name: Run deterministic unit tests
        run: python -m pytest -q tests/unit

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry==2.4.1

      - name: Validate committed dependency lock
        run: |
          test -f poetry.lock
          poetry check --lock
          poetry lock
          git diff --exit-code -- poetry.lock

  docker-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build --target cpu --tag soika-uds:cpu .

      - name: Start CPU environment
        run: docker run --detach --name soika-cpu --publish 18080:8080 soika-uds:cpu

      - name: Validate health and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs soika-cpu
          exit 1

      - name: Build GPU image
        run: docker build --target gpu --tag soika-uds:gpu .

      - name: Stop test container
        if: always()
        run: docker rm --force soika-cpu || true
