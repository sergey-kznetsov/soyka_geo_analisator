name: stage6a-bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prepare-source-connectors

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Verify and unpack connector package
        run: |
          cat > /tmp/stage6a-parts.sha256 <<'EOF'
          1984994dbace997f48c00c4668821b8f396b674954550fbee095882becf2d6e2  .stage6a/payload-00
          8e986d9f4a5b11ea322d7f06e209bfe61bfbbe1b348ad5dcc5bf5392c1c1ee33  .stage6a/payload-01
          431b276a0b9e729d58b8a86a5ffa156328e13270d18db87aef67b1dc1a4c697b  .stage6a/payload-02
          1e9f6bb76534fa5e264d91f0aedf2f851c40a1085d9959870217830eee389fc0  .stage6a/payload-03
          d16f97b219dfb646f2cce0baca3d9af187ec838513fabe45413899ce498069ec  .stage6a/payload-04
          17dcac63c859fea95810274a40dee397d460a167b94aa4d8022c47c66cb524f8  .stage6a/payload-05
          EOF
          sha256sum --check /tmp/stage6a-parts.sha256
          cat .stage6a/payload-* > /tmp/stage6a.b64
          printf '%s  %s\n' \
            '96aab5c8b6a6e159dcf4d275207f6a40a1e26972bd51dadce195e5e324e87f75' \
            '/tmp/stage6a.b64' | sha256sum --check
          base64 --decode /tmp/stage6a.b64 > /tmp/stage6a.tar.gz
          printf '%s  %s\n' \
            '0bc5720abb4e1d7ae18804b3562150f1df3223a4b7f108c7659516b7bf1720a3' \
            '/tmp/stage6a.tar.gz' | sha256sum --check
          gzip --test /tmp/stage6a.tar.gz
          tar -xzf /tmp/stage6a.tar.gz -C .

      - name: Update package metadata and development plan
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old = 'version = "0.6.0"'
          if old not in text:
              raise SystemExit("pyproject version marker not found")
          text = text.replace(old, 'version = "0.7.0"', 1)
          include_marker = '    "soika_uds/parsers/schemas/*.json",\n'
          connector_include = '    "soika_uds/parsers/connectors/schemas/*.json",\n'
          if connector_include not in text:
              if include_marker not in text:
                  raise SystemExit("pyproject include marker not found")
              text = text.replace(
                  include_marker,
                  include_marker + connector_include,
                  1,
              )
          pyproject.write_text(text, encoding="utf-8")

          package = Path("soika_uds/__init__.py")
          text = package.read_text(encoding="utf-8")
          old = '__version__ = "0.6.0"'
          if old not in text:
              raise SystemExit("package version marker not found")
          package.write_text(
              text.replace(old, '__version__ = "0.7.0"', 1),
              encoding="utf-8",
          )

          plan = Path("docs/DEVELOPMENT_PLAN.md")
          text = plan.read_text(encoding="utf-8")
          heading = "## 6. Парсеры приоритетных источников\n"
          block = (
              "\n**Этап 6A: подготовка коннекторов — выполнено 5 августа 2026 года.**\n\n"
              "Подготовлены отключённые по умолчанию RU-only определения для VK, "
              "Одноклассников, локальных СМИ, муниципальных публичных источников, "
              "Дзен, Pikabu и RUTUBE. Добавлены HTML-профили, free-first ограничения, "
              "контракты возможностей и checkpoint. Подробности: "
              "`docs/CONNECTOR_PREPARATION.md`.\n\n"
              "Подключение этих определений к `ParserAdapter`, `ParserRegistry` и "
              "`ParserRunner` выполняется на этапе 6B.\n"
          )
          if block.strip() not in text:
              if heading not in text:
                  raise SystemExit("stage 6 heading not found")
              text = text.replace(heading, heading + block, 1)
          plan.write_text(text, encoding="utf-8")

          models = Path("soika_uds/parsers/connectors/models.py")
          text = models.read_text(encoding="utf-8")
          old = (
              "        if self.cost_model is ConnectorCostModel.OPTIONAL_PAID:\n"
              "            if not self.customer_supplied_credentials:\n"
              "                raise ConnectorDefinitionError(\n"
              "                    \"optional paid connectors require customer-supplied credentials\"\n"
              "                )\n"
          )
          new = (
              "        if (\n"
              "            self.cost_model is ConnectorCostModel.OPTIONAL_PAID\n"
              "            and not self.customer_supplied_credentials\n"
              "        ):\n"
              "            raise ConnectorDefinitionError(\n"
              "                \"optional paid connectors require customer-supplied credentials\"\n"
              "            )\n"
          )
          if old not in text:
              raise SystemExit("connector lint rewrite marker not found")
          models.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate prepared connectors
        run: |
          python -m pip install --upgrade \
            pytest==7.4.4 \
            ruff==0.6.9 \
            pymorphy3==2.0.6 \
            pymorphy3-dicts-ru==2.4.417150.4580142
          ruff check --fix \
            soika_uds/parsers/connectors \
            tests/unit/test_connector_preparation.py
          ruff format \
            soika_uds/parsers/connectors \
            tests/unit/test_connector_preparation.py
          ruff check \
            soika_uds/parsers/connectors \
            tests/unit/test_connector_preparation.py
          python -m compileall -q soika_uds/parsers/connectors
          python -m pytest -q tests/unit/test_connector_preparation.py

      - name: Remove bootstrap artifacts
        run: |
          rm -rf .stage6a
          rm .github/workflows/stage6a-bootstrap.yml

      - name: Commit prepared connectors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Russian source connectors"
          git push origin HEAD:agent/prepare-source-connectors
