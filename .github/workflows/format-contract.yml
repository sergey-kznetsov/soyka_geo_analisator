name: format-contract

on:
  push:
    branches: [agent/versioned-soika-contract-v1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versioned-soika-contract-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install Ruff
        run: python -m pip install ruff==0.6.9

      - name: Format contract files
        run: |
          ruff format soika_uds/integration tests/unit/test_contract_schemas.py tests/unit/test_integration_contract.py
          ruff check --fix --unsafe-fixes soika_uds/integration tests/unit/test_contract_schemas.py tests/unit/test_integration_contract.py

      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add soika_uds/integration tests/unit/test_contract_schemas.py tests/unit/test_integration_contract.py
            git commit -m "Format integration contract"
            git push origin HEAD:agent/versioned-soika-contract-v1
          fi
