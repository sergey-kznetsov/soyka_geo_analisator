name: stage6b-line-fix

on:
  push:
    branches: [agent/stage6b-parser-adapters]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage6b-parser-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Apply exact line-length fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("soika_uds/parsers/connectors/adapters.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'external_id=f"document:{_stable_external_id(self.source_id, canonical_url, \'document\')}",': '''external_id=(
                        "document:"
                        + _stable_external_id(
                            self.source_id, canonical_url, "document"
                        )
                    ),''',
              'external_id=f"comment:{_stable_external_id(self.source_id, canonical_url, comment_id)}",': '''external_id=(
                            "comment:"
                            + _stable_external_id(
                                self.source_id, canonical_url, comment_id
                            )
                        ),''',
              'external_id=f"feed:{_stable_external_id(self.source_id, item_url, str(index))}",': '''external_id=(
                        "feed:"
                        + _stable_external_id(
                            self.source_id, item_url, str(index)
                        )
                    ),''',
              '"Accept": "text/html, application/rss+xml, application/atom+xml, application/xml;q=0.9"': '''"Accept": (
                    "text/html, application/rss+xml, "
                    "application/atom+xml, application/xml;q=0.9"
                )''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected fragment not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --upgrade ruff==0.6.9
          ruff format soika_uds/parsers/connectors/adapters.py
          ruff check soika_uds/parsers/connectors/adapters.py

      - name: Remove temporary workflow
        run: rm .github/workflows/stage6b-line-fix.yml

      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining stage 6B lint issues"
          git push origin HEAD:agent/stage6b-parser-adapters
