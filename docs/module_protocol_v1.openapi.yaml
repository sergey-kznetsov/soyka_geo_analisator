openapi: 3.1.0
info:
  title: Geo Analyzer Analysis Module Protocol
  version: 1.0.0
  description: >-
    Private server-to-server contract used by Geo Analyzer to execute optional
    analysis modules. A module source registration is not a runtime endpoint and
    must be verified separately before a connector is activated.
servers:
  - url: https://module.internal
security:
  - bearerAuth: []
paths:
  /v1/manifest:
    get:
      operationId: getModuleManifest
      responses:
        "200":
          description: Module manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/health:
    get:
      operationId: getModuleHealth
      responses:
        "200":
          description: Module is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Module is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleHealth"
  /v1/analyses:
    post:
      operationId: submitModuleAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleAnalysisRequest"
      responses:
        "202":
          description: Analysis accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /v1/analyses/{analysis_id}:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getModuleAnalysisStatus
      responses:
        "200":
          description: Current analysis status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/analyses/{analysis_id}/result:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getModuleAnalysisResult
      responses:
        "200":
          description: Terminal analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/analyses/{analysis_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: cancelModuleAnalysis
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/analyses/{analysis_id}/retry:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    post:
      operationId: retryModuleAnalysis
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AnalysisId:
      name: analysis_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Request conflicts with persisted analysis state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRequest:
      description: Request violates the module protocol
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Analysis was not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ProtocolVersion:
      type: string
      const: 1.0.0
    ModuleId:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{2,127}$"
    ModuleManifest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - module_id
        - display_name
        - module_version
        - capabilities
        - result_formats
        - supports_partial_result
        - supports_warnings
        - ui
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        module_id:
          $ref: "#/components/schemas/ModuleId"
        display_name:
          type: string
          minLength: 1
        description:
          type: string
        module_version:
          type: string
          minLength: 1
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        result_formats:
          type: array
          uniqueItems: true
          items:
            enum: [json, geojson]
        supports_partial_result:
          type: boolean
        supports_warnings:
          type: boolean
        ui:
          type: object
          additionalProperties: false
          required:
            - optional
            - default_enabled
            - analysis_launch_toggle
            - capability_card
          properties:
            optional:
              type: boolean
            default_enabled:
              type: boolean
            analysis_launch_toggle:
              type: boolean
            capability_card:
              type: boolean
    ModuleHealth:
      type: object
      additionalProperties: true
      required: [protocol_version, module_id, status]
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        module_id:
          $ref: "#/components/schemas/ModuleId"
        status:
          enum: [ok, unavailable]
    ModuleAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - module_id
        - analysis_id
        - requested_at
        - idempotency_key
        - territory
        - sources
        - options
        - allow_partial
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        module_id:
          $ref: "#/components/schemas/ModuleId"
        analysis_id:
          type: string
          minLength: 1
        requested_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          minLength: 1
        territory:
          $ref: "#/components/schemas/Territory"
        sources:
          type: array
          items:
            type: string
            minLength: 1
        options:
          type: object
          additionalProperties: true
        allow_partial:
          type: boolean
    Territory:
      type: object
      additionalProperties: true
      required: [city]
      properties:
        city:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        point:
          type: object
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
        radius_meters:
          type: integer
          minimum: 1
        geometry:
          type: object
          additionalProperties: true
    ModuleStatus:
      type: object
      additionalProperties: true
      required:
        - protocol_version
        - module_id
        - module_version
        - analysis_id
        - status
        - updated_at
        - progress_percent
        - stage
        - warnings
        - errors
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        module_id:
          $ref: "#/components/schemas/ModuleId"
        module_version:
          type: string
          minLength: 1
        analysis_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PublicStatus"
        raw_status:
          type: string
        updated_at:
          type: string
          format: date-time
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    PublicStatus:
      enum:
        - queued
        - running
        - completed
        - completed_with_warnings
        - failed
        - cancelled
    ModuleResult:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - module_id
        - module_version
        - analysis_id
        - status
        - generated_at
        - partial
        - coverage
        - warnings
        - errors
        - result
        - geojson
        - report_sections
      properties:
        protocol_version:
          $ref: "#/components/schemas/ProtocolVersion"
        module_id:
          $ref: "#/components/schemas/ModuleId"
        module_version:
          type: string
          minLength: 1
        analysis_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PublicStatus"
        raw_status:
          type: string
        generated_at:
          type: string
          format: date-time
        partial:
          type: boolean
        coverage:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        result:
          type: object
          additionalProperties: true
        geojson:
          type: object
          additionalProperties: true
        report_sections:
          type: array
          items:
            $ref: "#/components/schemas/ReportSection"
    ReportSection:
      type: object
      additionalProperties: false
      required: [section_id, title, sheet_name, columns, rows]
      properties:
        section_id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        sheet_name:
          type: string
          minLength: 1
          maxLength: 31
        columns:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    Issue:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    Problem:
      type: object
      additionalProperties: true
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
