name: soika-worker-runtime

x-worker-common: &worker-common
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  volumes:
    - soika-worker-models:/var/cache/soika/models:ro
  secrets:
    - geoanalyzer_database_dsn
  environment:
    GEOANALYZER_DATABASE_DSN_FILE: /run/secrets/geoanalyzer_database_dsn
    SOIKA_WORKER_EXECUTOR: ${SOIKA_WORKER_EXECUTOR:?SOIKA_WORKER_EXECUTOR is required}
  expose:
    - "9090"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=3).read()
    interval: 30s
    timeout: 5s
    start_period: 30s
    retries: 3
  networks:
    - geoanalyzer_backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  stop_grace_period: 2m

services:
  soika-worker-cpu:
    <<: *worker-common
    build:
      context: .
      target: cpu
    image: soika-uds-development:cpu
    mem_limit: ${SOIKA_CPU_MEMORY_LIMIT:-4g}
    cpus: ${SOIKA_CPU_CPUS:-2.0}
    command:
      - soika-worker
      - --compute-class
      - cpu
      - --probe-host
      - 0.0.0.0
      - --allow-remote-probes
      - --require-memory-limit-mb
      - ${SOIKA_CPU_MEMORY_MAX_MB:-4096}

  soika-worker-gpu:
    <<: *worker-common
    build:
      context: .
      target: gpu
    image: soika-uds-development:gpu
    mem_limit: ${SOIKA_GPU_MEMORY_LIMIT:-12g}
    cpus: ${SOIKA_GPU_CPUS:-4.0}
    command:
      - soika-worker
      - --compute-class
      - gpu
      - --probe-host
      - 0.0.0.0
      - --allow-remote-probes
      - --require-memory-limit-mb
      - ${SOIKA_GPU_MEMORY_MAX_MB:-12288}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  soika-module-api:
    build:
      context: .
      target: cpu
    image: soika-uds-development:cpu
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    secrets:
      - geoanalyzer_database_dsn
      - soika_module_auth_token
    environment:
      GEOANALYZER_DATABASE_DSN_FILE: /run/secrets/geoanalyzer_database_dsn
      SOIKA_MODULE_AUTH_TOKEN_FILE: /run/secrets/soika_module_auth_token
    expose:
      - "9080"
    command:
      - soika-module-api
      - --host
      - 0.0.0.0
      - --port
      - "9080"
      - --allow-remote
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,urllib.request;
          token=pathlib.Path('/run/secrets/soika_module_auth_token').read_text().strip();
          request=urllib.request.Request('http://127.0.0.1:9080/v1/health',headers={'Authorization':'Bearer '+token});
          urllib.request.urlopen(request,timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - geoanalyzer_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${SOIKA_MODULE_API_MEMORY_LIMIT:-2g}
    cpus: ${SOIKA_MODULE_API_CPUS:-1.0}
    stop_grace_period: 30s

networks:
  geoanalyzer_backend:
    external: true
    name: ${GEOANALYZER_BACKEND_NETWORK:-geoanalyzer-backend}

secrets:
  geoanalyzer_database_dsn:
    file: ${GEOANALYZER_DATABASE_DSN_FILE:?GEOANALYZER_DATABASE_DSN_FILE is required}
  soika_module_auth_token:
    file: ${SOIKA_MODULE_AUTH_TOKEN_FILE:?SOIKA_MODULE_AUTH_TOKEN_FILE is required}

volumes:
  soika-worker-models:
