[tool.poetry]
name = "soika-uds-development"
version = "0.13.0"
description = "Server-side urban comment analysis module for the Geo Analyzer ecosystem"
authors = [
    "SOIKA upstream contributors",
    "UDS Development",
]
readme = "README.md"
license = "MIT"
packages = [
    { include = "factfinder" },
    { include = "soika_uds" },
    { include = "pymorphy2" },
]
include = [
    "factfinder/src/*.csv",
    "models/*.json",
    "soika_uds/integration/schemas/v1/*.json",
    "soika_uds/parsers/schemas/*.json",
    "soika_uds/parsers/connectors/schemas/*.json",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pandas = "2.0.1"
matplotlib = "3.7.1"
seaborn = "0.12.2"
nltk = "3.8.1"
scikit-learn = "1.2.2"
spacy = "3.5.2"
fuzzywuzzy = "0.18.0"
geopandas = "0.12.2"
numpy = "1.24.3"
flair = "0.12.2"
networkx = "3.1"
osm2geojson = "0.2.3"
osmnx = "1.5.1"
pymorphy3 = "2.0.6"
pymorphy3-dicts-ru = "2.4.417150.4580142"
torch = "2.0.1"
tqdm = "4.64.1"
geopy = "2.3.0"
shapely = "2.0.1"
transformers = "4.28.1"
huggingface-hub = "0.16.4"
bertopic = "0.15.0"
hdbscan = "0.8.33"
umap-learn = "0.5.3"
natasha = "1.6.0"
requests = "2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-cov = "4.1.0"
ruff = "0.6.9"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "7.1.2"
sphinx-rtd-theme = "1.3.0rc1"
autodocsumm = "0.2.11"

[tool.poetry.scripts]
soika-uds = "soika_uds.cli:main"
soika-classification-qualify = "soika_uds.classification.qualification_cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
